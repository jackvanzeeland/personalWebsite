<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO head: defaults for the dev server. Every built page gets its own
         values baked in by scripts/prerender.ts, and the router keeps them in
         sync on client navigation (both via src/app/seo.ts). -->
    <meta
      name="description"
      content="Jack Van Zeeland is a Chicago software engineer building automation, AI tooling, and side projects — 22 automations shipped, 48K+ hours saved."
    />
    <meta name="author" content="Jack Van Zeeland" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#04070f" />
    <link rel="canonical" href="https://jackvanzeeland.com/" />

    <!-- Reveal animations only hide content once JS is known to be running -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https://interactive-examples.mdn.mozilla.net; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://open.spotify.com; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / X -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://jackvanzeeland.com/" />
    <meta property="og:title" content="Jack Van Zeeland — Software Engineer" />
    <meta property="og:description" content="Jack Van Zeeland is a Chicago software engineer building automation, AI tooling, and side projects — 22 automations shipped, 48K+ hours saved." />
    <meta property="og:image" content="https://jackvanzeeland.com/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jack Van Zeeland — Software Engineer, Chicago" />
    <meta property="og:site_name" content="Jack Van Zeeland" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jack Van Zeeland — Software Engineer" />
    <meta name="twitter:description" content="Jack Van Zeeland is a Chicago software engineer building automation, AI tooling, and side projects — 22 automations shipped, 48K+ hours saved." />
    <meta name="twitter:image" content="https://jackvanzeeland.com/og/default.jpg" />
    <meta name="twitter:image:alt" content="Jack Van Zeeland — Software Engineer, Chicago" />

    <title>Jack Van Zeeland — Software Engineer</title>

    <!-- schema.org graph, written by src/app/seo.ts -->
    <script type="application/ld+json" id="structured-data"></script>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="scene-root" aria-hidden="true"></div>
    <nav id="nav-root" aria-label="Main navigation"></nav>
    <main id="view-root"></main>
    <footer id="footer-root"></footer>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
